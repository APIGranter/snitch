[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snitch-analyzer"
description = "Turn a packet capture into a geolocated, reputation-checked and classified traffic report with an offline HTML dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "APIGranter" }]
keywords = ["pcap", "pcapng", "tshark", "wireshark", "network", "sni", "dns", "security", "forensics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
]
dependencies = []
dynamic = ["version"]

[project.scripts]
snitch = "snitchlib.cli:main"

[project.urls]
Homepage = "https://github.com/APIGranter/snitch"
Issues = "https://github.com/APIGranter/snitch/issues"

[tool.setuptools]
packages = ["snitchlib", "snitchlib.templates"]
include-package-data = true

[tool.setuptools.package-data]
snitchlib = ["world.geo.json"]
"snitchlib.templates" = ["*.html"]

[tool.setuptools.dynamic]
version = { attr = "snitchlib.__version__" }
